<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização ilustrativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="janela">
        <header class="barra-titulo">
            <div class="semaforo">
                <span class="bolinha vermelha"></span>
                <span class="bolinha amarela"></span>
                <span class="bolinha verde"></span>
            </div>
            <h1 class="titulo">visualização ilustrativa</h1>
            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <main class="conteudo">
            <section class="bloco">
                <h2 class="rotulo">Array principal · valores em reais</h2>
                <ul class="lista-valores">
                    <li class="valor">R$ 5,00</li>
                    <li class="valor">R$ 12,00</li>
                    <li class="valor">R$ 18,00</li>
                    <li class="valor">R$ 25,00</li>
                </ul>
            </section>

            <section class="bloco">
                <h2 class="rotulo">Nova operação</h2>
                <div class="linha-operacao">
                    <span class="valor novo">+ R$ 50,00</span>
                    <span class="nota">&#8627; novo valor no final</span>
                </div>
            </section>

            <section class="historico">
                <h3 class="historico-titulo">Histórico salvo</h3>
                <p class="historico-texto">
                    15/10/2026 • 14:30 &nbsp; push() &rarr; R$ 50,00 adicionado
                </p>
            </section>
        </main>
    </div>
</body>
</html>
